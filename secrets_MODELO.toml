# ============================================================
# MODELO DE CONFIGURACAO (Secrets) PARA O SISTEMA DE RH
# ------------------------------------------------------------
# Onde colar: painel do seu app em https://share.streamlit.io
#   -> seu app -> (tres pontinhos) -> Settings -> aba Secrets
#
# Substitua cada COLE_AQUI... pelos valores do arquivo .json da
# conta de servico do Google, e os IDs pelas suas 4 planilhas.
# Depois clique em Save. NAO compartilhe este conteudo com ninguem.
# ============================================================

[gspread]
type = "service_account"
project_id = "COLE_AQUI_project_id"
private_key_id = "COLE_AQUI_private_key_id"
private_key = "-----BEGIN PRIVATE KEY-----\nCOLE_AQUI_A_CHAVE_INTEIRA_COM_OS_\n_NO_MEIO\n-----END PRIVATE KEY-----\n"
client_email = "COLE_AQUI_client_email"
client_id = "COLE_AQUI_client_id"
auth_uri = "https://accounts.google.com/o/oauth2/auth"
token_uri = "https://oauth2.googleapis.com/token"
auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
client_x509_cert_url = "COLE_AQUI_client_x509_cert_url"

[gsheets]
id_funcionarios = "COLE_AQUI_ID_DA_PLANILHA_RH_Funcionarios"
id_diarias      = "COLE_AQUI_ID_DA_PLANILHA_RH_Diarias"
id_viagens      = "COLE_AQUI_ID_DA_PLANILHA_RH_Viagens"
id_compras      = "COLE_AQUI_ID_DA_PLANILHA_RH_Compras"
somente_nuvem   = true
