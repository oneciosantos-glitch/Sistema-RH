# ==============================================================
#  ARQUIVO DE CONFIGURAÇÃO — PASTA FIXA DE DADOS
# ==============================================================
#
#  COMO USAR (3 passos):
#
#  1) Renomeie este arquivo para:   secrets.toml
#
#  2) Crie uma pasta chamada  .streamlit  (com o ponto na frente)
#     ao lado do arquivo app_rh_corrigido.py e coloque o
#     secrets.toml dentro dela. Deve ficar assim:
#
#         pasta_do_aplicativo/
#           app_rh_corrigido.py
#           .streamlit/
#             secrets.toml      <-- este arquivo
#
#  3) Troque o caminho abaixo pela pasta onde você quer guardar
#     os dados. Depois feche e abra o aplicativo de novo.
#
#  CONFERINDO: na barra lateral do app deve aparecer a mensagem
#  azul "Dados salvos em pasta fixa". Se aparecer a mensagem
#  vermelha de risco de perda, o caminho não foi lido — confira
#  o nome da pasta .streamlit, o nome secrets.toml e as barras.
#
# ==============================================================


[dados]

# Pasta onde ficarão as planilhas, os anexos e os backups.
# Se ela não existir, o sistema cria sozinho.
pasta = "C:/Dados_RH"


# --------------------------------------------------------------
#  EXEMPLOS DE CAMINHO (use apenas UMA linha "pasta = ...")
# --------------------------------------------------------------
#
#  Windows, disco local:
#     pasta = "C:/Dados_RH"
#     pasta = "D:/Sistemas/RH/Dados"
#
#  Windows, com barra invertida (precisa ser DUPLA):
#     pasta = "C:\\Dados_RH"
#
#  Pasta de rede da empresa (melhor opção para várias pessoas):
#     pasta = "//servidor/rh/Dados_RH"
#     pasta = "Z:/Dados_RH"
#
#  OneDrive / Google Drive sincronizado no PC:
#     pasta = "C:/Users/SeuNome/OneDrive/Dados_RH"
#
#  Linux ou Mac:
#     pasta = "/home/usuario/Dados_RH"
#     pasta = "/Users/seunome/Dados_RH"
#
#  ATENÇÃO no Windows: barra simples invertida (C:\Dados_RH)
#  causa erro. Use C:/Dados_RH ou C:\\Dados_RH.
# --------------------------------------------------------------


# ==============================================================
#  OPCIONAL — SENHA DE ACESSO
#  Para ativar, apague o # das duas linhas abaixo e troque a
#  senha. Se deixar desativado, o app abre sem pedir senha.
# ==============================================================

# [acesso]
# senha = "troque-esta-senha"


# ==============================================================
#  IMPORTANTE
#
#  - Se você JÁ tem dados salvos hoje ao lado do programa,
#    copie estes itens para a pasta nova ANTES de reiniciar:
#      dados_funcionarios.xlsx
#      controle_diarias.xlsx
#      registro_viagens.xlsx
#      dados_compras.json
#      Documentos_Lojas/  Documentos_Funcionarios/
#      Fotos_Funcionarios/  Comprovantes_Diarias/
#      Backups_Automaticos/
#
#  - Para VÁRIAS PESSOAS usarem juntas, todos devem apontar para
#    a MESMA pasta compartilhada. É isso que ativa a fila de
#    gravação, o aviso de conflito e o histórico de alterações.
#
#  - Não envie este arquivo para o GitHub se ele contiver senha.
# ==============================================================
